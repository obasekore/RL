[project]
name = "rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coppeliasim-zmqremoteapi-client>=2.0.4",
    "gymnasium>=1.3.0",
    "lxml>=6.1.1",
    "numpy>=2.5.1",
    "pyyaml>=6.0.2",
    "pyzmq>=27.1.0",
]

[project.optional-dependencies]
sb3 = ["stable-baselines3>=2.0.0"]
demos = ["h5py>=3.10.0"]
teleop = ["pynput>=1.7.6"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coppelia_rl"]
